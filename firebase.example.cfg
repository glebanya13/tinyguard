; Copy to firebase.cfg (not committed) and fill in from the Firebase console:
; Project settings -> General -> "Your apps" -> Web app -> config.
; The web API key identifies the project; access is limited by firestore.rules.
[firebase]
api_key="AIza..."
project_id="bimbleguard"
; Optional, only for co-op (Realtime Database, docs/MULTIPLAYER.md). Without it co-op is off.
; Console -> Build -> Realtime Database -> the URL at the top of the Data tab.
; database_url="https://bimbleguard-default-rtdb.firebaseio.com"
