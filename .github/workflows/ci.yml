name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: gdlint scripts tests tools
      - name: gdformat
        run: gdformat --line-length 100 --check scripts tests tools

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT: /opt/godot/Godot
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot 4.7.2
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-4.7.2-stable-linux-x86_64
      - name: Download Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          curl -sSfL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 "$GODOT"
          chmod +x "$GODOT"
      - name: Validate project structure
        run: python3 tools/validate_project.py
      - name: Import resources
        run: "$GODOT" --headless --path . --import
      - name: Tests (130 launches, ~15 min)
        run: bash tests/run_all.sh "$GODOT"
